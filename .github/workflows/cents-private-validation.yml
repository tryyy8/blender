name: CENTS Private Repo Validation

on:
  push:
    branches:
      - main
    paths:
      - .github/cents-validation/request.json
  workflow_dispatch:
    inputs:
      cents_branch:
        description: Private CENTS branch to validate
        required: true
        type: choice
        options:
          - cents-game-prototype
          - cents-dev-bridge

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      cents_branch: ${{ steps.resolve.outputs.cents_branch }}
    steps:
      - name: Check out public request repository
        uses: actions/checkout@v4

      - name: Resolve and validate requested private branch
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.cents_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            branch="$INPUT_BRANCH"
          else
            request=".github/cents-validation/request.json"
            if [[ ! -f "$request" ]]; then
              echo "::error::Missing CENTS validation request file."
              exit 1
            fi
            branch="$(node -e 'const r=require("./.github/cents-validation/request.json"); if (!r || typeof r.request_id !== "string" || !r.request_id || typeof r.cents_branch !== "string") process.exit(2); process.stdout.write(r.cents_branch)')"
          fi

          case "$branch" in
            cents-game-prototype|cents-dev-bridge) ;;
            *)
              echo "::error::Refusing unapproved CENTS branch: $branch"
              exit 1
              ;;
          esac

          echo "cents_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Validated private branch request: $branch"

  validate-game:
    needs: resolve
    if: needs.resolve.outputs.cents_branch == 'cents-game-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify private-repository token is configured
        shell: bash
        env:
          CENTS_READ_TOKEN: ${{ secrets.CENTS_READ_TOKEN }}
        run: |
          if [[ -z "$CENTS_READ_TOKEN" ]]; then
            echo "::error title=Missing CENTS_READ_TOKEN::Add a fine-grained token with Contents: Read-only access to tryyy8/CENTS as an Actions secret in tryyy8/blender."
            exit 1
          fi

      - name: Check out private CENTS game source
        uses: actions/checkout@v4
        with:
          repository: tryyy8/CENTS
          ref: ${{ needs.resolve.outputs.cents_branch }}
          token: ${{ secrets.CENTS_READ_TOKEN }}
          path: cents
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        working-directory: cents
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        working-directory: cents
        run: npm test

      - name: Type-check game source
        working-directory: cents
        run: npm run typecheck

      - name: Build browser game
        working-directory: cents
        run: npm run build

  validate-bridge:
    needs: resolve
    if: needs.resolve.outputs.cents_branch == 'cents-dev-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify private-repository token is configured
        shell: bash
        env:
          CENTS_READ_TOKEN: ${{ secrets.CENTS_READ_TOKEN }}
        run: |
          if [[ -z "$CENTS_READ_TOKEN" ]]; then
            echo "::error title=Missing CENTS_READ_TOKEN::Add a fine-grained token with Contents: Read-only access to tryyy8/CENTS as an Actions secret in tryyy8/blender."
            exit 1
          fi

      - name: Check out private CENTS bridge source
        uses: actions/checkout@v4
        with:
          repository: tryyy8/CENTS
          ref: ${{ needs.resolve.outputs.cents_branch }}
          token: ${{ secrets.CENTS_READ_TOKEN }}
          path: cents
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bridge regression tests
        working-directory: cents
        run: npm test
