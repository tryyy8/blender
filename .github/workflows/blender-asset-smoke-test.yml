name: Blender Asset Pipeline Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blender-asset-smoke-test.yml
      - tools/blender/**

permissions:
  contents: write

concurrency:
  group: blender-asset-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out asset generator
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender python3-numpy

      - name: Generate Blender assets
        run: |
          mkdir -p build/district01
          blender --background --python tools/blender/pipeline_smoke_test.py -- --output build/district01/pipeline-smoke-test.glb
          blender --background --python tools/blender/district01_commercial_building.py -- --output build/district01/district01-commercial-building.glb
          blender --background --python tools/blender/cents_material_identity_study.py -- --output build/district01/cents-material-identity-study.glb --size 384
          blender --background --python tools/blender/retail_store_kit.py -- --output build/district01/retail-store-kit.glb --texture-size 256 --preview build/district01/retail-store-kit-preview.png
          test -s build/district01/pipeline-smoke-test.glb
          test -s build/district01/district01-commercial-building.glb
          test -s build/district01/cents-material-identity-study.glb
          test -s build/district01/retail-store-kit.glb
          test -s build/district01/retail-store-kit-preview.png
          ls -lh build/district01/*.glb

      - name: Publish generated visual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p assets
            cp build/district01/district01-commercial-building.glb assets/district01-commercial-building.glb
            cp build/district01/cents-material-identity-study.glb assets/cents-material-identity-study.glb
            cp build/district01/retail-store-kit.glb assets/retail-store-kit.glb
            git add assets/district01-commercial-building.glb assets/cents-material-identity-study.glb assets/retail-store-kit.glb
            if git diff --cached --quiet; then
              echo "Generated assets already match main."
              exit 0
            fi
            git commit -m "Publish generated CENTS retail store asset kit"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying publish (attempt $attempt)."
            sleep 2
          done
          echo "Could not publish generated assets after five attempts."
          exit 1

      - name: Upload generated models
        uses: actions/upload-artifact@v4
        with:
          name: cents-retail-store-asset-kit
          path: |
            build/district01/*.glb
            build/district01/retail-store-kit-preview.png
          if-no-files-found: error
          retention-days: 7
