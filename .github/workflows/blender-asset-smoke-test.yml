name: Blender Pipeline and Asset Studies
# Blender LTS is pinned and restored from Actions cache before generation.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blender-asset-smoke-test.yml
      - tools/blender/**

permissions:
  contents: write

concurrency:
  group: blender-asset-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BLENDER_VERSION: 4.5.16
    steps:
      - name: Check out asset generator
        uses: actions/checkout@v4

      - name: Restore cached Blender LTS distribution
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.16
          key: blender-${{ runner.os }}-4.5.16-linux-x64

      - name: Install Blender when cache is missing
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          BLENDER_DIR="$RUNNER_TEMP/blender-$BLENDER_VERSION"
          if [[ ! -x "$BLENDER_DIR/blender" ]]; then
            archive="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender4.5"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 \
              "$base/blender-$BLENDER_VERSION-linux-x64.tar.xz" -o "$archive"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 60 \
              "$base/blender-$BLENDER_VERSION.sha256" -o "$archive.sha256"
            expected="$(grep -F "blender-$BLENDER_VERSION-linux-x64.tar.xz" "$archive.sha256" | grep -oE '[0-9a-fA-F]{64}' | head -n 1)"
            test -n "$expected"
            echo "$expected  $archive" | sha256sum --check
            mkdir -p "$BLENDER_DIR"
            timeout 300s tar -xJf "$archive" -C "$BLENDER_DIR" --strip-components=1
            rm -f "$archive" "$archive.sha256"
          else
            echo "Using cached Blender $BLENDER_VERSION distribution."
          fi
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          "$BLENDER_DIR/blender" --background --factory-startup --python-expr "import bpy; assert bpy.app.version_string.startswith('$BLENDER_VERSION'), bpy.app.version_string; print('BLENDER_VERSION=' + bpy.app.version_string)"

      - name: Generate Blender assets
        timeout-minutes: 18
        run: |
          set -euxo pipefail
          mkdir -p build/district01
          blender --background --python tools/blender/pipeline_smoke_test.py -- --output build/district01/pipeline-smoke-test.glb
          blender --background --python tools/blender/cents_material_identity_study.py -- --output build/district01/cents-material-identity-study.glb --size 384
          blender --background --python tools/blender/cents_packaging_preview.py -- --output build/district01/cents-packaging-preview.png
          test -s build/district01/pipeline-smoke-test.glb
          test -s build/district01/cents-material-identity-study.glb
          test -s build/district01/cents-packaging-preview.png
          ls -lh build/district01/*.glb

      - name: Publish generated visual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p assets
            cp build/district01/cents-material-identity-study.glb assets/cents-material-identity-study.glb
            git add assets/cents-material-identity-study.glb
            if git diff --cached --quiet; then
              echo "Generated assets already match main."
              exit 0
            fi
            git commit -m "Publish generated CENTS environment studies"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying publish (attempt $attempt)."
            sleep 2
          done
          echo "Could not publish generated assets after five attempts."
          exit 1

      - name: Upload generated models
        uses: actions/upload-artifact@v4
        with:
          name: cents-blender-material-and-pipeline-studies
          path: |
            build/district01/*.glb
            build/district01/cents-packaging-preview.png
          if-no-files-found: error
          retention-days: 7
