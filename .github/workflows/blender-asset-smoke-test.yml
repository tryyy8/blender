name: Blender Asset Pipeline Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blender-asset-smoke-test.yml
      - tools/blender/**

permissions:
  contents: read

jobs:
  build-test-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out asset generator
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender python3-numpy

      - name: Generate a test GLB
        run: |
          mkdir -p build/district01
          blender --background --python tools/blender/pipeline_smoke_test.py -- --output build/district01/pipeline-smoke-test.glb
          blender --background --python tools/blender/district01_commercial_building.py -- --output build/district01/district01-commercial-building.glb
          test -s build/district01/pipeline-smoke-test.glb
          test -s build/district01/district01-commercial-building.glb
          ls -lh build/district01/*.glb

      - name: Upload generated model
        uses: actions/upload-artifact@v4
        with:
          name: cents-district01-building-assets
          path: build/district01/*.glb
          if-no-files-found: error
          retention-days: 7
